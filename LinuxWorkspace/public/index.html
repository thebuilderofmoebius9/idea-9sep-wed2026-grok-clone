<!doctype html>
<html lang="th">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BotWorkspace Linux</title><link rel="stylesheet" href="style.css"></head>
  <body>
    <aside><header><span class="mark">◈</span><div><b>BotWorkspace</b><small>Linux workspace</small></div></header><button id="new-chat" class="primary">＋ บทสนทนาใหม่</button><section><div class="label">บทสนทนา</div><nav id="conversation-list"></nav></section><section><div class="label">AI teammates <button id="new-bot" aria-label="เพิ่มบอท">＋</button></div><ul id="bot-list"></ul></section></aside>
    <main><header class="chat-header"><div><h1 id="title"></h1><small>ข้อมูลเก็บอยู่ในเบราว์เซอร์เครื่องนี้</small></div><span class="offline">ยังไม่ได้เชื่อมผู้ให้บริการ</span></header><div id="messages"></div><form id="send-form"><textarea id="composer" placeholder="พิมพ์ข้อความ…" rows="2"></textarea><button class="primary" type="submit">ส่ง</button></form></main>
    <script type="module" src="app.js"></script>
  </body>
